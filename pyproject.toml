[project]
name = "python-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ted Gromov", email = "ted@intch.org" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
python-learning = "python_learning:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

# ============================================================================
# Ruff — форматтер и линтер в одном. Аналог Prettier + ESLint.
# Настройки живут здесь, в pyproject.toml: отдельного .prettierrc не бывает,
# в Python весь тулинг конфигурируется из одного файла.
# ============================================================================

[tool.ruff]
# 88 символов — не случайное число. Это дефолт Black, форматтера, который
# в 2018 закончил все споры о стиле в Python. Ruff совместим с ним, поэтому
# 88 стало отраслевым стандартом. Не меняй без причины: чужой код будет
# приходить именно в этом формате.
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"          # двойные кавычки, как в Black и Prettier
indent-style = "space"          # 4 пробела
skip-magic-trailing-comma = false
docstring-code-format = true    # форматирует и примеры кода внутри docstrings

[tool.ruff.lint]
# Ruff — это ~900 правил из десятков старых линтеров, собранных в один бинарь.
# Каждый префикс — это семейство правил, заменяющее отдельный инструмент.
select = [
    "E",    # pycodestyle errors — нарушения PEP 8
    "W",    # pycodestyle warnings
    "F",    # Pyflakes — неиспользуемые импорты и переменные, опечатки в именах
    "I",    # isort — сортировка импортов (аналог organize-imports)
    "N",    # pep8-naming — snake_case для функций, PascalCase для классов
    "UP",   # pyupgrade — переписывает код на современный синтаксис
    "B",    # flake8-bugbear — реальные баги, включая ловушку с mutable default
    "C4",   # flake8-comprehensions — упрощает списковые включения
    "SIM",  # flake8-simplify — «это же можно короче»
    "RUF",  # собственные правила Ruff
    "PTH",  # flake8-use-pathlib — pathlib вместо os.path
    "PL",   # Pylint — часть проверок из Pylint
    "ARG",  # flake8-unused-arguments — неиспользуемые аргументы
]

ignore = [
    "E501",    # длина строки — этим занимается форматтер, линтеру не надо
    "RUF001",  # неоднозначные Unicode-символы в строках…
    "RUF002",  # …в docstrings…
    "RUF003",  # …в комментариях.
    # Три правила выше ругаются на кириллицу: русская «с» похожа на латинскую
    # «c», и Ruff подозревает опечатку. Мы пишем комментарии по-русски, так что
    # это шум. Если начнёшь писать код в англоязычной команде — включи обратно.
]

[tool.ruff.lint.isort]
known-first-party = ["python_learning"]

[tool.ruff.lint.per-file-ignores]
# В тестах свои правила игры.
"**/test_*.py" = [
    "ARG001",   # фикстуры часто приходят в аргументах и «не используются»
    "PLR2004",  # магические числа в assert — это нормально
    "S101",     # assert — весь смысл тестов
]
"**/conftest.py" = ["E402"]  # там намеренно правим sys.path до импортов
